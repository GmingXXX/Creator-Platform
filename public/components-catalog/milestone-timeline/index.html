const defaults={heading:'星澜智造 · 发展里程',events:'2012｜从一间实验室出发｜一支小团队，以工业设备感知开启创新旅程。\n2018｜让生产过程清晰可见｜数字化示范产线投运，连接设备、质量与能源数据。\n2022｜构建工厂的数字映像｜数字孪生试点落地，让设备状态与维修培训可视化。\n2025｜向协同制造迈进｜连接更多工厂与合作伙伴，探索跨区域协同。',accent:'#245d4c',imageUrl:'',motion:true};
const nav=document.getElementById('years'),content=document.getElementById('content'),originalImage=document.getElementById('image').src;
let items=[],activeIndex=0,animated=true;
function render(){nav.replaceChildren(...items.map((item,index)=>{const button=document.createElement('button');button.textContent=item.year;button.setAttribute('role','tab');button.setAttribute('aria-selected',String(index===activeIndex));button.onclick=()=>{activeIndex=index;render();nav.children[index]?.focus();if(animated&&!matchMedia('(prefers-reduced-motion:reduce)').matches)content.animate([{opacity:0,transform:'translateX(20px)'},{opacity:1,transform:'translateX(0)'}],{duration:400,easing:'ease-in-out'});};return button;}));const item=items[activeIndex];document.getElementById('year').textContent=item.year;document.getElementById('title').textContent=item.title;document.getElementById('description').textContent=item.description;document.getElementById('count').textContent=`${activeIndex+1} / ${items.length}`;}
function apply(props){const next=String(props.events).split('\n').filter(row=>row.trim()).slice(0,12).map(row=>{const [year,title,...body]=row.split('｜');return {year:year||'—',title:title||'未命名事件',description:body.join('｜')};});items=next.length?next:[{year:'—',title:'请添加事件',description:''}];activeIndex=Math.min(activeIndex,items.length-1);animated=props.motion;document.getElementById('heading').textContent=props.heading;document.body.style.setProperty('--accent',/^#[a-f0-9]{6}$/i.test(props.accent)?props.accent:defaults.accent);const url=String(props.imageUrl||'');document.getElementById('image').src=/^(https?:\/\/|\/[^/])/i.test(url)?url:originalImage;render();}
nav.addEventListener('keydown',event=>{if(!['ArrowRight','ArrowLeft','ArrowDown','ArrowUp'].includes(event.key))return;event.preventDefault();const step=['ArrowRight','ArrowDown'].includes(event.key)?1:-1;nav.children[(activeIndex+step+items.length)%items.length].click();});
if(window.ZhichuangComponent)window.ZhichuangComponent.subscribe(apply);else apply(defaults);
