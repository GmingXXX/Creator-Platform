<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>技术星图 · 交互样例</title><style>
*{box-sizing:border-box}body{margin:0;background:#071b29;color:#edfaff;font-family:system-ui,"PingFang SC",sans-serif;min-height:100vh;overflow:hidden}.frame{position:relative;min-height:100vh;padding:6vh 7vw;background:radial-gradient(ellipse at 65% 50%,#17394b66,transparent 60%)}header{position:relative;z-index:2}h1{font-size:clamp(23px,4vw,43px);font-weight:500;letter-spacing:.1em;margin:0 0 12px}p{font-size:13px;color:#88a8ba;line-height:1.8;margin:0}svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.edge{stroke:#79d5db;stroke-width:1;opacity:.3}.node{cursor:pointer;outline:none}.node circle{fill:#0b2838;stroke:#6fcede;stroke-width:1;transition:fill .2s,stroke-width .2s}.node:hover circle,.node:focus circle{fill:#154455;stroke-width:2}.node text{font-size:14px;fill:#daf6ff;text-anchor:middle;pointer-events:none}.node.active circle{fill:#26788d}.panel{position:absolute;bottom:7vh;left:7vw;max-width:330px;border-left:2px solid #7ad3de;padding:6px 20px;backdrop-filter:blur(5px)}.panel h2{font-size:20px;font-weight:500;margin:0 0 8px}.hint{position:absolute;right:7vw;bottom:7vh;font-size:11px;color:#7394a6}button{z-index:3;position:absolute;right:7vw;top:6vh;border:1px solid #3c6479;border-radius:8px;color:#9dc6d9;background:#112d3c;padding:9px 14px;cursor:pointer}button:focus-visible{outline:2px solid #a4efff;outline-offset:4px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="frame"><header><h1>让技术，连接更多可能</h1><p>选择一个技术领域，探索创新与应用的联系</p></header><button id="reset">返回总览</button><svg viewBox="0 0 1000 650" role="group" aria-label="可交互技术关系图"><g id="edges"></g><g id="nodes"></g></svg><section class="panel" aria-live="polite"><h2 id="name">创新生态</h2><p id="desc">从核心技术到产业实践，构建开放协同的创新网络。点击图中节点查看介绍。</p></section><span class="hint">支持触摸与键盘操作</span></main><script>
const items=[{id:'core',x:540,y:315,r:55,title:'创新生态',desc:'连接基础研究、核心技术与产业应用，让每一次创新形成持续的价值。'},{id:'ai',x:350,y:215,r:40,title:'人工智能',desc:'从知识理解到智能交互，构建更自然、更高效的内容体验。'},{id:'data',x:755,y:200,r:39,title:'数据科学',desc:'汇聚多源信息，发现数据中的规律，为决策提供清晰的依据。'},{id:'industry',x:790,y:405,r:45,title:'智能制造',desc:'通过数字化与自动化协同，连接生产环节，推动制造质量与效率提升。'},{id:'design',x:575,y:520,r:38,title:'体验设计',desc:'以人的需求为起点，让复杂信息成为直观、可理解、可探索的体验。'},{id:'cloud',x:330,y:400,r:35,title:'云端协同',desc:'以开放连接支持跨团队共创，让能力和知识持续积累、快速复用。'}];
const ns='http://www.w3.org/2000/svg';const name=document.getElementById('name'),desc=document.getElementById('desc');
function select(item){name.textContent=item.title;desc.textContent=item.desc;document.querySelectorAll('.node').forEach(n=>n.classList.toggle('active',n.dataset.id===item.id))}
items.forEach((n,i)=>{if(i){const line=document.createElementNS(ns,'path');line.setAttribute('d',`M540 315 Q${(540+n.x)/2+30} ${(315+n.y)/2-25} ${n.x} ${n.y}`);line.setAttribute('class','edge');line.setAttribute('fill','none');document.getElementById('edges').append(line)}const g=document.createElementNS(ns,'g');g.dataset.id=n.id;g.setAttribute('class','node');g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',n.title);const circle=document.createElementNS(ns,'circle');circle.setAttribute('cx',n.x);circle.setAttribute('cy',n.y);circle.setAttribute('r',n.r);const text=document.createElementNS(ns,'text');text.setAttribute('x',n.x);text.setAttribute('y',n.y+5);text.textContent=n.title;g.append(circle,text);g.addEventListener('click',()=>select(n));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(n)}});document.getElementById('nodes').append(g)});document.getElementById('reset').addEventListener('click',()=>select(items[0]));
</script></body></html>
